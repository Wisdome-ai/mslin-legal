<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Ms. Lin 登入</title>
<!--
  Magic-link 登入中繼頁（MAGIC-LINK-004 核心不變量）：
  本頁「絕不驗 token」— 不 import supabase-js、不發任何網路請求（icon 除外）。
  magic-link token 一次性：verify.html 那種「載入即 verifyOtp」會把 token 在
  網頁上消耗掉（session 也被丟棄），App 就永遠拿不到 session。本頁只把
  token_hash 原封放進「開啟 App 登入」按鈕的 deep link，由 App 端
  verifyOtp({ token_hash, type:'magiclink' }) 消耗。純靜態同時天然防
  email 掃描器預抓連結誤耗 token（掃描器不會點 custom-scheme 按鈕）。
-->
<style>
  :root { --brand:#5b5bff; --bg:#EEEEFF; }
  * { box-sizing:border-box; }
  body{font-family:-apple-system,system-ui,"PingFang TC","Noto Sans TC",sans-serif;margin:0;
       background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;
       color:#1f2430;padding:20px}
  .card{background:#fff;max-width:420px;width:100%;padding:32px 24px;border-radius:20px;
        box-shadow:0 8px 30px rgba(80,80,160,.15);text-align:center}
  .logo{width:80px;height:80px;border-radius:20px;margin:0 auto 16px;object-fit:cover;
        box-shadow:0 4px 14px rgba(80,80,160,.18);border:1px solid rgba(0,0,0,.04)}
  #status{font-size:20px;font-weight:700;margin:4px 0 2px;min-height:28px}
  #detail{font-size:14px;color:#888;margin-bottom:4px;min-height:18px}
  .intro{margin:18px 0;color:#555;line-height:1.7;font-size:15px}
  .hint{margin:14px 0 0;color:#999;line-height:1.6;font-size:13px}
  a.btn{display:block;margin:10px 0;padding:14px;border-radius:12px;text-decoration:none;font-weight:600}
  a.primary{background:var(--brand);color:#fff}
  a.ghost{background:#f0f0f7;color:var(--brand)}
  [hidden]{display:none}
</style>
</head>
<body>
<main class="card">
  <img class="logo" id="logo" alt="Ms. Lin" />
  <div id="status">準備登入 Ms. Lin</div>
  <div id="detail"></div>

  <section id="intro" class="intro" hidden>
    <p>點下方按鈕回到 App，<br>不用輸入帳號密碼即可登入。</p>
  </section>

  <a id="openApp" class="btn primary" hidden>開啟 App 登入</a>
  <a id="store"  class="btn ghost"  hidden target="_blank" rel="noopener">還沒安裝？取得 App</a>

  <p id="hints" class="hint" hidden>
    請在<b>手機</b>上開啟此信件的連結。<br>
    按鈕沒反應？請點右上角選單改用 <b>Safari / Chrome</b> 開啟本頁再試一次。
  </p>
</main>

<script>
// ── 環境設定（純前端、零網路；本頁不驗 token，所以不需要 Supabase URL / anon key）──
// scheme 對齊 gsat-app appVariant.js（此處含 ://，App 端是純名 — 兩邊形狀不同勿搞混）。
// ⚠️ 此 ENVS map 與 verify.html 重複，改任一邊請同步另一邊（待抽共用模組）。
const ENVS = {
  prod: {
    scheme:'mslin://',
    icon:  'icon.png',
    store: 'https://apps.apple.com/app/id6761799933', // 上架後生效
  },
  stage: {
    scheme:'mslinbeta://',
    icon:  'icon-beta.png',
    store: '',                                         // staging 只在 TestFlight；填外部測試連結或留空
  },
  local: {                                             // local = 雲端 dev 專案（非本地 Supabase）
    scheme:'mslinbeta://',
    icon:  'icon-beta.png',
    store: '',
  },
}

const qs = new URLSearchParams(location.search)
const env = ENVS[qs.get('env')] ?? ENVS.prod          // fail-safe：未指定 → prod
const token_hash = qs.get('token_hash')
const type = qs.get('type') || 'magiclink'
const $ = id => document.getElementById(id)
$('logo').src = env.icon                              // env-aware app icon（prod 紫 / stage 白）

function fail(statusText, detailText) {
  $('status').textContent = statusText
  $('detail').textContent = detailText || ''
}

// Supabase 有時會把錯誤直接放在 URL（連結過期等）
const urlErr = qs.get('error_description') || qs.get('error')
if (urlErr) {
  fail('⚠️ 登入連結有問題', decodeURIComponent(urlErr))
} else if (!token_hash) {
  fail('⚠️ 連結無效', '缺少登入參數，請改用信件中的完整連結，或回 App 重新寄送。')
} else {
  // token_hash 原封轉發進 App — 本頁不碰它（MAGIC-LINK-004/005）。
  $('intro').hidden = false
  const open = $('openApp')
  open.hidden = false
  open.href = env.scheme + 'magic-link?token_hash=' + encodeURIComponent(token_hash) +
              '&type=' + encodeURIComponent(type)
  if (env.store) { const s = $('store'); s.hidden = false; s.href = env.store }
  $('hints').hidden = false
}
</script>
</body>
</html>
