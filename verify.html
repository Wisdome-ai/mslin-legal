<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Ms. Lin 信箱驗證</title>
<!--
  裝置分流（2026-07-13 需求對齊）：
  - 手機開本頁：**不碰一次性 token** — 原封放進「開啟 App 完成驗證」按鈕的
    deep link（<scheme>://email-verified?token_hash=…&type=…），由 App 端
    verifyEmailFromUrl 消耗 = 驗證＋自動登入一次完成。網頁在這裡搶先驗證
    會把票用掉，App 就只能開起來卻沒登入。
  - 電腦開本頁：照舊載入即 verifyOtp（persistSession:false，驗完不留登入
    狀態）— 電腦上沒有 App 可登入，驗證完成即達成目的。
  - 手機備援：「改在網頁上完成驗證」連結 → 走電腦同款流程（沒裝 App 等情境）。
-->
<style>
  :root { --brand:#5b5bff; --bg:#EEEEFF; }
  * { box-sizing:border-box; }
  body{font-family:-apple-system,system-ui,"PingFang TC","Noto Sans TC",sans-serif;margin:0;
       background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;
       color:#1f2430;padding:20px}
  .card{background:#fff;max-width:420px;width:100%;padding:32px 24px;border-radius:20px;
        box-shadow:0 8px 30px rgba(80,80,160,.15);text-align:center}
  .logo{width:80px;height:80px;border-radius:20px;margin:0 auto 16px;object-fit:cover;
        box-shadow:0 4px 14px rgba(80,80,160,.18);border:1px solid rgba(0,0,0,.04)}
  #status{font-size:20px;font-weight:700;margin:4px 0 2px;min-height:28px}
  #detail{font-size:14px;color:#888;margin-bottom:4px;min-height:18px}
  .intro{margin:18px 0;color:#555;line-height:1.7;font-size:15px}
  a.btn{display:block;margin:10px 0;padding:14px;border-radius:12px;text-decoration:none;font-weight:600}
  a.primary{background:var(--brand);color:#fff}
  a.ghost{background:#f0f0f7;color:var(--brand)}
  .spinner{width:26px;height:26px;border:3px solid #d8d8f0;border-top-color:var(--brand);
           border-radius:50%;margin:8px auto;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* !important：a.btn{display:block}（class+element）特異性高於 [hidden]（attribute），
     沒有 !important 時隱藏中的按鈕會照樣顯示（2026-07-12 實測抓到的 bug）。 */
  [hidden]{display:none !important}
</style>
</head>
<body>
<main class="card">
  <img class="logo" id="logo" alt="Ms. Lin" />
  <div id="spin" class="spinner"></div>
  <div id="status">驗證中…</div>
  <div id="detail"></div>

  <section id="intro" class="intro" hidden>
    <p>歡迎使用 <b>Ms. Lin</b>！<br>拍照即解題、自動整理錯題本，<br>陪你準備學測 / 會考。</p>
  </section>

  <a id="openApp" class="btn primary" hidden>開啟 App</a>
  <a id="store"  class="btn ghost"  hidden target="_blank" rel="noopener">還沒安裝？取得 App</a>
  <a id="webVerify" class="btn ghost" href="#" hidden>無法開啟 App？改在網頁上完成驗證</a>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ── 環境設定 ─────────────────────────────────────────────
// anon key 是 public（本來就嵌在 App 內），可安全放前端。
// Supabase URL 取自各專案 ref；scheme 對齊 gsat-app appVariant.js（此處含 ://，App 端是純名）。
const ENVS = {
  prod: {
    url:   'https://rvmetywbpdmmxcxttwtn.supabase.co',
    anon:  'sb_publishable_E5Ym9-GEru4WwBq9Q2yz5g_WedXMvF9',
    scheme:'mslin://',
    icon:  'icon.png',
    store: 'https://apps.apple.com/app/id6761799933', // 上架後生效
  },
  stage: {
    url:   'https://rnndvcgwgblhuqhymhat.supabase.co',
    anon:  'sb_publishable__wr29yRsrtF6sVFGCkF_2Q_wVOjuClb',
    scheme:'mslinbeta://',
    icon:  'icon-beta.png',
    store: '',                                         // staging 只在 TestFlight；填外部測試連結或留空
  },
  local: {                                             // local = 雲端 dev 專案（非本地 Supabase）
    url:   'https://nqiqeyuavkweyinzcfkc.supabase.co',
    anon:  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xaXFleXVhdmt3ZXlpbnpjZmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTE5MDAsImV4cCI6MjA5NjI2NzkwMH0.mPWlLuk1kd98Jo7Q5WTGITi3_g8xo7OnkUL6zcvJ17U',
    scheme:'mslinbeta://',
    icon:  'icon-beta.png',
    store: '',
  },
}

const qs = new URLSearchParams(location.search)
const env = ENVS[qs.get('env')] ?? ENVS.prod          // fail-safe：未指定 → prod
const token_hash = qs.get('token_hash')
const type = qs.get('type') || 'email'                // Supabase {{ .Type }}（signup / email …）
const $ = id => document.getElementById(id)
$('logo').src = env.icon                              // env-aware app icon（prod 紫 / stage 白）

function show(statusText, detailText) {
  $('spin').hidden = true
  $('status').textContent = statusText
  $('detail').textContent = detailText || ''
}

function ok() {
  show('✅ 信箱驗證成功！')
  $('webVerify').hidden = true
  $('intro').hidden = false
  const open = $('openApp')
  open.textContent = '開啟 App'
  open.hidden = false
  open.href = env.scheme                              // 純開 App（票已用掉，App 端走一般登入）
  if (env.store) { const s = $('store'); s.hidden = false; s.href = env.store }
}

// 網頁端當場消耗 token 完成驗證（桌機主路徑；手機備援路徑）。
// persistSession:false → 在電腦 / 共用裝置驗證後不留下登入狀態。
async function webVerify() {
  $('webVerify').hidden = true
  $('openApp').hidden = true
  $('store').hidden = true
  $('spin').hidden = false
  $('status').textContent = '驗證中…'
  $('detail').textContent = ''
  try {
    const sb = createClient(env.url, env.anon, { auth:{ persistSession:false } })
    const { error } = await sb.auth.verifyOtp({ token_hash, type })
    if (error) return show('⚠️ 驗證失敗', error.message)
    ok()
  } catch (e) {
    show('⚠️ 發生錯誤', String(e?.message || e))
  }
}

const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
const urlErr = qs.get('error_description') || qs.get('error')

if (urlErr) {
  show('⚠️ 驗證失敗', decodeURIComponent(urlErr))
} else if (!token_hash) {
  show('⚠️ 連結無效', '缺少驗證參數，請改用信件中的完整連結。')
} else if (isMobile) {
  // 手機：不碰票。token 原封轉交 App，由 App 驗證＋自動登入一次完成。
  show('差最後一步！', '點下方按鈕回到 App，完成驗證並直接登入。')
  const open = $('openApp')
  open.textContent = '開啟 App 完成驗證'
  open.href = env.scheme + 'email-verified?token_hash=' + encodeURIComponent(token_hash) +
              '&type=' + encodeURIComponent(type)
  open.hidden = false
  if (env.store) { const s = $('store'); s.hidden = false; s.href = env.store }
  const wv = $('webVerify')
  wv.hidden = false
  wv.addEventListener('click', (e) => { e.preventDefault(); webVerify() })
} else {
  // 電腦：照舊當場驗證（沒有 App 可登入，驗證完成即達成目的）。
  webVerify()
}
</script>
</body>
</html>
